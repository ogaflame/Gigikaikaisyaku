<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>疑義解釈資料データベース | 令和８年度診療報酬改定</title>
<style>
  :root{
    --bg:#ffffff;
    --sidebar-bg:#fafafa;
    --ink:#1c1c1e;
    --ink-soft:#767680;
    --line:#ececec;
    --accent:#4f5dff;
    --accent-soft:#f0f1ff;
    --notice-mark:#fff1a6;
    /* 区分タグ用の濃淡トーン(同一色相・明度違いの6段階) */
    --tone1-bg:hsl(233 55% 95%); --tone1-text:hsl(233 55% 32%);
    --tone2-bg:hsl(233 55% 90%); --tone2-text:hsl(233 55% 28%);
    --tone3-bg:hsl(233 50% 83%); --tone3-text:hsl(233 55% 24%);
    --tone4-bg:hsl(233 45% 74%); --tone4-text:hsl(233 60% 18%);
    --tone5-bg:hsl(233 40% 63%); --tone5-text:#ffffff;
    --tone6-bg:hsl(233 45% 50%); --tone6-text:#ffffff;
  }
  html[data-theme="dark"]{
    --bg:#121214;
    --sidebar-bg:#18181b;
    --ink:#eceef0;
    --ink-soft:#9a9aa2;
    --line:#2b2b30;
    --accent:#8b93ff;
    --accent-soft:#232345;
    --notice-mark:#5c4e14;
    --tone1-bg:hsl(233 30% 22%); --tone1-text:hsl(233 70% 85%);
    --tone2-bg:hsl(233 32% 27%); --tone2-text:hsl(233 75% 88%);
    --tone3-bg:hsl(233 34% 33%); --tone3-text:hsl(233 80% 91%);
    --tone4-bg:hsl(233 38% 40%); --tone4-text:#f3f4ff;
    --tone5-bg:hsl(233 45% 50%); --tone5-text:#ffffff;
    --tone6-bg:hsl(233 55% 62%); --tone6-text:#0d0d12;
  }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){
      --bg:#121214;
      --sidebar-bg:#18181b;
      --ink:#eceef0;
      --ink-soft:#9a9aa2;
      --line:#2b2b30;
      --accent:#8b93ff;
      --accent-soft:#232345;
      --notice-mark:#5c4e14;
      --tone1-bg:hsl(233 30% 22%); --tone1-text:hsl(233 70% 85%);
      --tone2-bg:hsl(233 32% 27%); --tone2-text:hsl(233 75% 88%);
      --tone3-bg:hsl(233 34% 33%); --tone3-text:hsl(233 80% 91%);
      --tone4-bg:hsl(233 38% 40%); --tone4-text:#f3f4ff;
      --tone5-bg:hsl(233 45% 50%); --tone5-text:#ffffff;
      --tone6-bg:hsl(233 55% 62%); --tone6-text:#0d0d12;
    }
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    line-height:1.65;
    transition:background .15s ease,color .15s ease;
  }
  .layout{display:flex;min-height:100vh;}

  /* ===== サイドバー ===== */
  .sidebar{
    width:230px;flex-shrink:0;
    background:var(--sidebar-bg);
    border-right:1px solid var(--line);
    padding:1.6rem 1.2rem;
  }
  .sidebar .brand{font-size:.95rem;font-weight:700;margin:0 0 .15rem;}
  .sidebar .brand-sub{font-size:.7rem;color:var(--ink-soft);margin:0 0 1.5rem;}
  .theme-toggle{
    width:100%;
    font-size:.72rem;font-weight:600;
    color:var(--ink-soft);
    background:transparent;
    border:1px solid var(--line);
    border-radius:8px;
    padding:.5rem .7rem;
    cursor:pointer;
    font-family:inherit;
    margin-bottom:1.6rem;
  }
  .theme-toggle:hover{border-color:var(--accent);color:var(--accent);}
  .side-section{margin-bottom:1.4rem;}
  .side-section .label{
    font-size:.66rem;color:var(--ink-soft);letter-spacing:.06em;
    margin:0 0 .6rem;font-weight:700;
  }
  .side-list{display:flex;flex-direction:column;gap:.15rem;}
  .side-item{
    font-size:.82rem;
    padding:.4rem .55rem;
    border-radius:7px;
    cursor:pointer;
    color:var(--ink-soft);
    display:flex;justify-content:space-between;
  }
  .side-item:hover{background:var(--line);}
  .side-item.active{background:var(--accent);color:#fff;}
  .side-item .n{font-size:.7rem;color:var(--ink-soft);}
  .dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    margin-right:.45rem;vertical-align:1px;
  }
  .dot.tone-1{background:var(--tone1-bg);border:1px solid var(--line);}
  .dot.tone-2{background:var(--tone2-bg);border:1px solid var(--line);}
  .dot.tone-3{background:var(--tone3-bg);}
  .dot.tone-4{background:var(--tone4-bg);}
  .dot.tone-5{background:var(--tone5-bg);}
  .dot.tone-6{background:var(--tone6-bg);}
  .side-item.active .n{color:#e4e6ff;}

  /* ===== メイン ===== */
  .content{flex:1;padding:2.2rem 2.4rem 4rem;max-width:760px;}
  .notice{
    font-size:.76rem;color:var(--ink-soft);
    border-left:2px solid var(--line);
    padding-left:.9rem;
    margin-bottom:1.8rem;
    line-height:1.7;
  }
  .search-wrap{position:relative;margin-bottom:1.4rem;}
  .search-wrap input[type=text]{
    width:100%;
    border:none;
    border-bottom:2px solid var(--ink);
    padding:.7rem 0;
    font-size:1.1rem;
    font-family:inherit;
    background:transparent;
    color:var(--ink);
  }
  .search-wrap input[type=text]:focus{outline:none;border-color:var(--accent);}
  .search-wrap input[type=text]::placeholder{color:var(--ink-soft);opacity:.6;}
  .status{font-size:.74rem;color:var(--ink-soft);margin-bottom:1.5rem;padding-bottom:.8rem;border-bottom:1px solid var(--line);}
  .entry{padding:1.3rem 0;border-bottom:1px solid var(--line);}
  .entry .meta{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem;flex-wrap:wrap;}
  .chip{font-size:.68rem;font-weight:600;padding:.12rem .5rem;border-radius:5px;}
  /* 号数は分類情報ではないため、色を持たせずニュートラルに */
  .chip.sono{background:var(--line);color:var(--ink-soft);}
  /* 区分は同一色相・濃淡6段階のトーンで表現 */
  .chip.cat.tone-1{background:var(--tone1-bg);color:var(--tone1-text);}
  .chip.cat.tone-2{background:var(--tone2-bg);color:var(--tone2-text);}
  .chip.cat.tone-3{background:var(--tone3-bg);color:var(--tone3-text);}
  .chip.cat.tone-4{background:var(--tone4-bg);color:var(--tone4-text);}
  .chip.cat.tone-5{background:var(--tone5-bg);color:var(--tone5-text);}
  .chip.cat.tone-6{background:var(--tone6-bg);color:var(--tone6-text);}
  .entry .topic{font-size:.76rem;color:var(--ink-soft);}
  .entry .q{font-size:.98rem;font-weight:600;margin:0 0 .5rem;}
  .entry .a{font-size:.92rem;color:var(--ink);margin:0;}
  .entry .a::before{content:"— ";color:var(--ink-soft);}
  .entry a.src{
    display:inline-block;margin-top:.6rem;font-size:.76rem;color:var(--accent);text-decoration:none;
  }
  .entry a.src:hover{text-decoration:underline;}
  mark{background:var(--notice-mark);color:var(--ink);padding:0 .1em;}
  .empty{padding:4rem 0;text-align:center;color:var(--ink-soft);}

  /* ===== スマートフォン向け ===== */
  @media (max-width: 768px){
    body{font-size:15px;}
    .layout{flex-direction:column;min-height:auto;}
    .sidebar{
      width:100%;
      position:sticky;top:0;z-index:10;
      padding:.9rem .9rem;
      box-shadow:0 1px 0 var(--line);
    }
    .sidebar .brand-sub{margin-bottom:.8rem;}
    .theme-toggle{width:auto;margin-bottom:.8rem;}
    .side-section{margin-bottom:.7rem;}
    .side-list{
      flex-direction:row;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      gap:.4rem;
      padding-bottom:.1rem;
    }
    .side-item{
      flex-shrink:0;white-space:nowrap;
      border:1px solid var(--line);
    }
    .content{padding:1.1rem .9rem 2.5rem;max-width:100%;}
    .search-wrap input[type=text]{font-size:16px;}
    .notice{font-size:.72rem;}
  }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <p class="brand">疑義解釈資料データベース</p>
    <p class="brand-sub">令和８年度診療報酬改定</p>
    <button class="theme-toggle" id="themeToggle" type="button">ダークモード</button>
    <div class="side-section">
      <p class="label">疑義解釈資料の送付について</p>
      <div class="side-list" id="sonoList"></div>
    </div>
    <div class="side-section">
      <p class="label">区分</p>
      <div class="side-list" id="catList"></div>
    </div>
  </div>

  <div class="content">
    <p class="notice">
      社内向けの非公式な検索補助ツールです。内容は自動処理により構造化しているため、誤りを含む可能性があります。実務上の判断は、必ずリンク先の原文PDFをご確認ください。
    </p>

    <div class="search-wrap">
      <input type="text" id="q" placeholder="キーワードで検索">
    </div>

    <p class="status" id="status"></p>
    <div id="results"></div>
  </div>
</div>

<script>
let ALL=[], activeSono=null, activeCat=null;
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hl(text,terms){
  let t=esc(text);
  terms.forEach(term=>{
    if(!term) return;
    const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    t=t.replace(re,m=>`<mark>${m}</mark>`);
  });
  return t;
}
const ZEN_TO_HAN=str=>str.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));

// 区分名 → トーン番号(1〜6)への固定割り当て。
// 新しい区分が増えた場合は、ここに追記するか、末尾のフォールバックでハッシュ割り当てされる。
const CATEGORY_TONE={
  "医科":1,
  "歯科":2,
  "調剤":3,
  "訪問看護":4,
  "DPC":5,
  "看護職員処遇改善・ベースアップ評価料":6,
};
function toneFor(category){
  if(CATEGORY_TONE[category]) return CATEGORY_TONE[category];
  // 未登録の区分名は、文字列から安定したハッシュ値を作って1〜6に割り当てる
  let h=0;
  for(let i=0;i<category.length;i++){ h=(h*31+category.charCodeAt(i))>>>0; }
  return (h%6)+1;
}

function render(){
  const qv=document.getElementById('q').value.trim();
  const terms=qv.split(/\s+/).filter(Boolean);
  const filtered=ALL.filter(r=>{
    if(activeSono!==null&&r.sono!==activeSono) return false;
    if(activeCat!==null&&r.category!==activeCat) return false;
    if(!terms.length) return true;
    const hay=(r.topic||'')+' '+r.question+' '+r.answer;
    return terms.every(t=>hay.toLowerCase().includes(t.toLowerCase()));
  });
  document.getElementById('status').textContent=`${filtered.length} 件 / 全 ${ALL.length} 件`;
  const c=document.getElementById('results');
  if(!filtered.length){c.innerHTML='<div class="empty">該当する結果がありません。</div>';return;}
  c.innerHTML=filtered.map(r=>`
    <div class="entry">
      <div class="meta">
        <span class="chip sono">その${r.sono}</span>
        <span class="chip cat tone-${toneFor(r.category)}">${esc(r.category)}</span>
        ${r.topic?`<span class="topic">${esc(r.topic)}</span>`:''}
      </div>
      <p class="q">${hl(r.question,terms)}</p>
      <p class="a">${hl(r.answer,terms)}</p>
      ${r.source_url?`<a class="src" href="${r.source_url}${r.page?('#page='+r.page):''}" target="_blank">原文PDFを開く</a>`:''}
    </div>
  `).join('');
}
function buildFacets(){
  const sonos=[...new Set(ALL.map(r=>r.sono))].sort((a,b)=>parseInt(ZEN_TO_HAN(a),10)-parseInt(ZEN_TO_HAN(b),10));
  const cats=[...new Set(ALL.map(r=>r.category))];

  const sl=document.getElementById('sonoList');
  const allSono=document.createElement('div');
  allSono.className='side-item active';
  allSono.innerHTML=`<span>すべて</span><span class="n">${ALL.length}</span>`;
  allSono.onclick=()=>{activeSono=null;[...sl.children].forEach(x=>x.classList.remove('active'));allSono.classList.add('active');render();};
  sl.appendChild(allSono);
  sonos.forEach(v=>{
    const cnt=ALL.filter(r=>r.sono===v).length;
    const it=document.createElement('div');it.className='side-item';
    it.innerHTML=`<span>その${v}</span><span class="n">${cnt}</span>`;
    it.onclick=()=>{activeSono=v;[...sl.children].forEach(x=>x.classList.remove('active'));it.classList.add('active');render();};
    sl.appendChild(it);
  });

  const cl=document.getElementById('catList');
  const allCat=document.createElement('div');
  allCat.className='side-item active';
  allCat.innerHTML=`<span>すべて</span><span class="n"></span>`;
  allCat.onclick=()=>{activeCat=null;[...cl.children].forEach(x=>x.classList.remove('active'));allCat.classList.add('active');render();};
  cl.appendChild(allCat);
  cats.forEach(v=>{
    const cnt=ALL.filter(r=>r.category===v).length;
    const it=document.createElement('div');it.className='side-item';
    it.innerHTML=`<span><span class="dot tone-${toneFor(v)}"></span>${v}</span><span class="n">${cnt}</span>`;
    it.onclick=()=>{activeCat=v;[...cl.children].forEach(x=>x.classList.remove('active'));it.classList.add('active');render();};
    cl.appendChild(it);
  });
}
fetch('qa.json').then(r=>r.json()).then(d=>{ALL=d;buildFacets();render();});
document.getElementById('q').addEventListener('input',render);

// ダークモード切り替え(手動指定はlocalStorageに保存。未指定時はOS設定に追従)
const themeBtn=document.getElementById('themeToggle');
function systemPrefersDark(){
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function currentIsDark(){
  const saved=localStorage.getItem('gikai_theme');
  if(saved==='dark') return true;
  if(saved==='light') return false;
  return systemPrefersDark();
}
function applyTheme(){
  const saved=localStorage.getItem('gikai_theme');
  if(saved==='dark'){document.documentElement.setAttribute('data-theme','dark');}
  else if(saved==='light'){document.documentElement.setAttribute('data-theme','light');}
  else{document.documentElement.removeAttribute('data-theme');}
  themeBtn.textContent=currentIsDark()?'ライトモード':'ダークモード';
}
themeBtn.addEventListener('click',()=>{
  localStorage.setItem('gikai_theme', currentIsDark()?'light':'dark');
  applyTheme();
});
try{ applyTheme(); }catch(e){ themeBtn.textContent='ダークモード'; }
</script>
</body>
</html>
