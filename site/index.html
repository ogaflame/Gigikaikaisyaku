<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案E: シンプルミニマル | 疑義解釈資料データベース</title>
<style>
  :root{
    --bg:#ffffff;
    --ink:#1c1c1e;
    --ink-soft:#767680;
    --line:#ececec;
    --accent:#4f5dff;
    --accent-soft:#f0f1ff;
    --green:#1f9e6b;
    --green-soft:#eafaf3;
    --notice-mark:#fff1a6;
    --card-bg:transparent;
  }
  html[data-theme="dark"]{
    --bg:#121214;
    --ink:#eceef0;
    --ink-soft:#9a9aa2;
    --line:#2b2b30;
    --accent:#8b93ff;
    --accent-soft:#232345;
    --green:#4fd39a;
    --green-soft:#1b3a2d;
    --notice-mark:#5c4e14;
    --card-bg:transparent;
  }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){
      --bg:#121214;
      --ink:#eceef0;
      --ink-soft:#9a9aa2;
      --line:#2b2b30;
      --accent:#8b93ff;
      --accent-soft:#232345;
      --green:#4fd39a;
      --green-soft:#1b3a2d;
      --notice-mark:#5c4e14;
    }
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    line-height:1.65;
    transition:background .15s ease,color .15s ease;
  }
  .wrap{max-width:720px;margin:0 auto;padding:3rem 1.4rem 5rem;}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;}
  .eyebrow{font-size:.72rem;color:var(--ink-soft);letter-spacing:.08em;margin:0 0 .5rem;}
  h1{font-size:1.6rem;font-weight:600;margin:0 0 1.6rem;letter-spacing:-.01em;}
  .theme-toggle{
    flex-shrink:0;
    font-size:.72rem;font-weight:600;
    color:var(--ink-soft);
    background:transparent;
    border:1px solid var(--line);
    border-radius:999px;
    padding:.4rem .9rem;
    cursor:pointer;
    font-family:inherit;
  }
  .theme-toggle:hover{border-color:var(--accent);color:var(--accent);}
  .notice{
    font-size:.76rem;color:var(--ink-soft);
    border-left:2px solid var(--line);
    padding-left:.9rem;
    margin-bottom:2rem;
    line-height:1.7;
  }
  .search-wrap{position:relative;margin-bottom:1.2rem;}
  .search-wrap input[type=text]{
    width:100%;
    border:none;
    border-bottom:2px solid var(--ink);
    padding:.7rem 0;
    font-size:1.15rem;
    font-family:inherit;
    background:transparent;
  }
  .search-wrap input[type=text]:focus{outline:none;border-color:var(--accent);}
  .search-wrap input[type=text]::placeholder{color:#c6c6cc;}
  .filters{display:flex;gap:1.8rem;margin:1.3rem 0 1.6rem;flex-wrap:wrap;}
  .filter-col .label{font-size:.68rem;color:var(--ink-soft);letter-spacing:.06em;margin:0 0 .5rem;}
  .filter-col .opts{display:flex;flex-wrap:wrap;gap:.3rem;}
  .opt{
    font-size:.78rem;
    padding:.25rem .1rem;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .opt + .opt{margin-left:.6rem;}
  .opt.active{color:var(--accent);border-color:var(--accent);font-weight:600;}
  .status{font-size:.74rem;color:var(--ink-soft);margin-bottom:1.6rem;padding-bottom:.8rem;border-bottom:1px solid var(--line);}
  .entry{padding:1.4rem 0;border-bottom:1px solid var(--line);}
  .entry .meta{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem;}
  .chip{font-size:.68rem;font-weight:600;padding:.12rem .5rem;border-radius:5px;}
  .chip.sono{background:var(--accent-soft);color:var(--accent);}
  .chip.cat{background:var(--green-soft);color:var(--green);}
  .entry .topic{font-size:.76rem;color:var(--ink-soft);}
  .entry .q{font-size:.98rem;font-weight:600;margin:0 0 .5rem;}
  .entry .a{font-size:.92rem;color:#3a3a3e;margin:0;}
  .entry .a::before{content:"— ";color:var(--ink-soft);}
  .entry a.src{
    display:inline-block;margin-top:.6rem;font-size:.76rem;color:var(--accent);text-decoration:none;
  }
  .entry a.src:hover{text-decoration:underline;}
  mark{background:var(--notice-mark);color:var(--ink);padding:0 .1em;}
  .empty{padding:4rem 0;text-align:center;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <div>
      <p class="eyebrow">令和８年度診療報酬改定</p>
      <h1>疑義解釈資料データベース</h1>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">ダークモード</button>
  </div>

  <p class="notice">
    社内向けの非公式な検索補助ツールです。内容は自動処理により構造化しているため、誤りを含む可能性があります。実務上の判断は、必ずリンク先の原文PDFをご確認ください。
  </p>

  <div class="search-wrap">
    <input type="text" id="q" placeholder="キーワードで検索">
  </div>

  <div class="filters">
    <div class="filter-col">
      <p class="label">疑義解釈資料の送付について</p>
      <div class="opts" id="sonoOpts"></div>
    </div>
    <div class="filter-col">
      <p class="label">区分</p>
      <div class="opts" id="catOpts"></div>
    </div>
  </div>

  <p class="status" id="status"></p>
  <div id="results"></div>
</div>

<script>
let ALL=[], activeSono=null, activeCat=null;
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hl(text,terms){
  let t=esc(text);
  terms.forEach(term=>{
    if(!term) return;
    const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    t=t.replace(re,m=>`<mark>${m}</mark>`);
  });
  return t;
}
const ZEN_TO_HAN=str=>str.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
function render(){
  const qv=document.getElementById('q').value.trim();
  const terms=qv.split(/\s+/).filter(Boolean);
  const filtered=ALL.filter(r=>{
    if(activeSono!==null&&r.sono!==activeSono) return false;
    if(activeCat!==null&&r.category!==activeCat) return false;
    if(!terms.length) return true;
    const hay=(r.topic||'')+' '+r.question+' '+r.answer;
    return terms.every(t=>hay.toLowerCase().includes(t.toLowerCase()));
  });
  document.getElementById('status').textContent=`${filtered.length} 件 / 全 ${ALL.length} 件`;
  const c=document.getElementById('results');
  if(!filtered.length){c.innerHTML='<div class="empty">該当する結果がありません。</div>';return;}
  c.innerHTML=filtered.map(r=>`
    <div class="entry">
      <div class="meta">
        <span class="chip sono">その${r.sono}</span>
        <span class="chip cat">${esc(r.category)}</span>
        ${r.topic?`<span class="topic">${esc(r.topic)}</span>`:''}
      </div>
      <p class="q">${hl(r.question,terms)}</p>
      <p class="a">${hl(r.answer,terms)}</p>
      ${r.source_url?`<a class="src" href="${r.source_url}${r.page?('#page='+r.page):''}" target="_blank">原文PDFを開く</a>`:''}
    </div>
  `).join('');
}
function buildFacets(){
  const sonos=[...new Set(ALL.map(r=>r.sono))].sort((a,b)=>parseInt(ZEN_TO_HAN(a),10)-parseInt(ZEN_TO_HAN(b),10));
  const cats=[...new Set(ALL.map(r=>r.category))];
  const sw=document.getElementById('sonoOpts');
  sonos.forEach(v=>{
    const b=document.createElement('span');b.className='opt';b.textContent=`その${v}`;
    b.onclick=()=>{activeSono=activeSono===v?null:v;
      [...sw.children].forEach(x=>x.classList.remove('active'));
      if(activeSono!==null)b.classList.add('active');render();};
    sw.appendChild(b);
  });
  const cw=document.getElementById('catOpts');
  cats.forEach(v=>{
    const b=document.createElement('span');b.className='opt';b.textContent=v;
    b.onclick=()=>{activeCat=activeCat===v?null:v;
      [...cw.children].forEach(x=>x.classList.remove('active'));
      if(activeCat!==null)b.classList.add('active');render();};
    cw.appendChild(b);
  });
}
fetch('qa.json').then(r=>r.json()).then(d=>{ALL=d;buildFacets();render();});
document.getElementById('q').addEventListener('input',render);

// ダークモード切り替え(手動指定はlocalStorageに保存。未指定時はOS設定に追従)
const themeBtn=document.getElementById('themeToggle');
function systemPrefersDark(){
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function currentIsDark(){
  const saved=localStorage.getItem('gikai_theme');
  if(saved==='dark') return true;
  if(saved==='light') return false;
  return systemPrefersDark();
}
function applyTheme(){
  const saved=localStorage.getItem('gikai_theme');
  if(saved==='dark'){document.documentElement.setAttribute('data-theme','dark');}
  else if(saved==='light'){document.documentElement.setAttribute('data-theme','light');}
  else{document.documentElement.removeAttribute('data-theme');}
  themeBtn.textContent=currentIsDark()?'ライトモード':'ダークモード';
}
themeBtn.addEventListener('click',()=>{
  localStorage.setItem('gikai_theme', currentIsDark()?'light':'dark');
  applyTheme();
});
try{ applyTheme(); }catch(e){ themeBtn.textContent='ダークモード'; }
</script>
</body>
</html>
